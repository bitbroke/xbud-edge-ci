name: ARM64 Linux Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  arm64-tests:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg alsa-utils wget tar bzip2

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Confirm ARM64 environment
        run: |
          uname -m
          python --version
          free -h
          df -h

      - name: Run safe ARM64 tests
        run: |
          mkdir -p reports test-results
          pytest tests -q --ignore=tests/test_real_audio_hardware.py --ignore=tests/test_real_model_downloads.py --junitxml=test-results/junit.xml | tee reports/pytest_output.txt

      - name: Verify manifests and hashes
        run: |
          python benchmarks/run_m8.py --dataset datasets/test_fixture --verify-only | tee reports/benchmark_verify.txt

      - name: Download real Zipformer English model
        run: |
          mkdir -p models
          wget -q https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-zipformer-en-2023-06-26.tar.bz2
          tar xf sherpa-onnx-zipformer-en-2023-06-26.tar.bz2 -C models/
          rm -f sherpa-onnx-zipformer-en-2023-06-26.tar.bz2

      - name: Run real English ASR ARM64 smoke test
        run: |
          python scripts/smoke_test_real_asr.py --model-dir models/sherpa-onnx-zipformer-en-2023-06-26 --speech-wav tests/fixtures/speech_test.wav --silence-wav tests/fixtures/silence_test.wav --output-dir reports | tee reports/smoke_test_output.txt

      - name: Run ARM64 English command evaluation benchmark
        run: |
          python benchmarks/run_arm64_command_eval.py --model-dir models/sherpa-onnx-zipformer-en-2023-06-26 --corpus-dir datasets/arm64_eval_corpus --output-dir reports | tee reports/arm64_command_eval_output.txt

      - name: Upload test evidence
        uses: actions/upload-artifact@v4
        with:
          name: arm64-test-evidence
          path: |
            reports/
            test-results/
          if-no-files-found: warn
