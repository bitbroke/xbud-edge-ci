name: ARM64 Linux Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  arm64-tests:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg alsa-utils libportaudio2 libsndfile1 wget tar bzip2 cmake g++

      - name: Install Python dependencies
        id: deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install sherpa-onnx==1.13.8

      - name: Confirm ARM64 environment
        run: |
          mkdir -p reports test-results
          test "$(uname -m)" = "aarch64"
          { uname -a; lscpu; python --version; free -h; df -h; git rev-parse HEAD; } | tee reports/environment.txt
          pip freeze | tee reports/packages.txt

      - name: Run safe ARM64 tests
        run: |
          mkdir -p reports test-results
          python -m pytest tests -q --ignore=tests/test_real_audio_hardware.py --ignore=tests/test_real_model_downloads.py --junitxml=test-results/junit.xml | tee reports/pytest_output.txt

      - name: Verify manifests and hashes
        run: |
          python benchmarks/run_m8.py --dataset datasets/test_fixture --verify-only | tee reports/benchmark_verify.txt

      - name: Download real Zipformer English model
        id: model
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          mkdir -p models
          wget -q --timeout=30 --tries=3 https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-zipformer-en-2023-06-26.tar.bz2
          tar xjf sherpa-onnx-zipformer-en-2023-06-26.tar.bz2 -C models/ --wildcards '*/tokens.txt' '*/encoder-epoch-99-avg-1.int8.onnx' '*/decoder-epoch-99-avg-1.int8.onnx' '*/joiner-epoch-99-avg-1.int8.onnx'
          rm -f sherpa-onnx-zipformer-en-2023-06-26.tar.bz2
          python - <<'PY' | tee reports/model_verification.txt
          from pathlib import Path
          import hashlib
          from benchmarks.run_arm64_command_eval import FROZEN_MODEL_HASHES
          root = Path("models/sherpa-onnx-zipformer-en-2023-06-26")
          assert {p.name for p in root.iterdir()} == set(FROZEN_MODEL_HASHES)
          for name, expected in FROZEN_MODEL_HASHES.items():
              with (root/name).open("rb") as stream:
                  actual = hashlib.file_digest(stream, "sha256").hexdigest()
              assert actual == expected, name
              print(name, actual, "MATCH")
          PY

      - name: Run real English ASR ARM64 smoke test
        if: ${{ !cancelled() && steps.model.outcome == 'success' }}
        run: |
          python scripts/smoke_test_real_asr.py --model-dir models/sherpa-onnx-zipformer-en-2023-06-26 --speech-wav tests/fixtures/speech_test.wav --silence-wav tests/fixtures/silence_test.wav --output-dir reports | tee reports/smoke_test_output.txt

      - name: Run ARM64 English command evaluation benchmark
        if: ${{ !cancelled() && steps.model.outcome == 'success' }}
        run: |
          python benchmarks/run_arm64_command_eval.py --model-dir models/sherpa-onnx-zipformer-en-2023-06-26 --corpus-dir datasets/arm64_eval_corpus --output-dir reports | tee reports/arm64_command_eval_output.txt

      - name: Stress real int8 timeout and restart recovery
        if: ${{ !cancelled() && steps.model.outcome == 'success' }}
        run: |
          python -u scripts/stress_sherpa_restart.py --model-dir models/sherpa-onnx-zipformer-en-2023-06-26 --output reports/restart_int8 --cycles 30 --precision int8 | tee reports/restart_stress_output.txt

      - name: Prepare pinned Whisper and neural VAD comparison
        id: comparison_models
        if: ${{ !cancelled() && steps.model.outcome == 'success' }}
        run: |
          git clone https://github.com/ggml-org/whisper.cpp.git /tmp/xbud-whisper
          git -C /tmp/xbud-whisper checkout 6a94163b913d8e974e60d9ac56c8930d19f45773
          # Cortex-A76 (Pi 5 / RK3588S) and this N2 runner support ARMv8.2 FP16.
          # Do not deploy this binary to older ARM CPUs without FP16 support.
          cmake -S /tmp/xbud-whisper -B /tmp/xbud-whisper/build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_BLAS=OFF -DWHISPER_BUILD_TESTS=OFF -DCMAKE_C_FLAGS=-march=armv8.2-a+fp16 -DCMAKE_CXX_FLAGS=-march=armv8.2-a+fp16
          cmake --build /tmp/xbud-whisper/build --config Release -j 4
          { git -C /tmp/xbud-whisper rev-parse HEAD; c++ --version; cat /tmp/xbud-whisper/build/CMakeCache.txt; } > reports/whisper_build.txt
          wget -q --timeout=30 --tries=3 -O models/ggml-base-latest.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin
          wget -q --timeout=30 --tries=3 -O models/silero_vad.onnx https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx
          echo '60ed5bc3dd14eea856493d334349b405782ddcaf0028d4b5df4088345fba2efe  models/ggml-base-latest.bin' | sha256sum --check
          echo '9e2449e1087496d8d4caba907f23e0bd3f78d91fa552479bb9c23ac09cbb1fd6  models/silero_vad.onnx' | sha256sum --check
          find /tmp/xbud-whisper/build/bin -maxdepth 1 -type f -executable -print | tee reports/whisper_executables.txt

      - name: Verify bounded normalization safety
        id: normalization
        if: ${{ !cancelled() && steps.comparison_models.outcome == 'success' }}
        run: |
          python scripts/check_normalization_safety.py --vad-model models/silero_vad.onnx --output reports/normalization_safety | tee reports/normalization_output.txt

      - name: Compare normalized Sherpa on frozen human clips
        if: ${{ !cancelled() && steps.normalization.outcome == 'success' }}
        run: |
          python -u scripts/compare_human_local.py --project "$PWD" --output reports/paired_sherpa --engines sherpa --safe-normalize-sherpa --repeats 2 | tee reports/paired_sherpa_output.txt

      - name: Compare unchanged Whisper Base on same human clips
        if: ${{ !cancelled() && steps.comparison_models.outcome == 'success' }}
        run: |
          python -u scripts/compare_human_local.py --project "$PWD" --output reports/paired_whisper --engines whisper --whisper-cli /tmp/xbud-whisper/build/bin/main --repeats 2 | tee reports/paired_whisper_output.txt

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-test-evidence
          path: |
            reports/
            test-results/
          if-no-files-found: warn
