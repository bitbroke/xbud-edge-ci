name: ARM64 Linux Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  arm64-tests:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg alsa-utils

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Confirm ARM64 environment
        run: |
          uname -m
          python --version
          free -h
          df -h

      - name: Run safe ARM64 tests
        run: |
          mkdir -p reports test-results
          pytest tests -q --ignore=tests/test_real_audio_hardware.py --ignore=tests/test_real_model_downloads.py --junitxml=test-results/junit.xml | tee reports/pytest_output.txt

      - name: Verify manifests and hashes
        run: |
          python benchmarks/run_m8.py --dataset datasets/test_fixture --verify-only | tee reports/benchmark_verify.txt

      - name: Upload test evidence
        uses: actions/upload-artifact@v4
        with:
          name: arm64-test-evidence
          path: |
            reports/
            test-results/
          if-no-files-found: warn
